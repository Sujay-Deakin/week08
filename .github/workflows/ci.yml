name: CI – Build & Push (backend + frontend)

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}  # e.g., wk10acr.azurecr.io
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}  # Dynamically tag images using Git SHA and Run ID

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ product_service, order_service, frontend ]

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Azure login using Service Principal credentials from AZURE_CREDENTIALS
      - name: Azure Login (SP secret)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to Azure Container Registry (ACR) using Azure CLI (az acr login)
      - name: Docker login to ACR
        run: |
          az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}  # Logs in to ACR using az cli

      # Build and Push Docker images (for frontend and backend services)
      - name: Build & push ${{ matrix.service }}
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.IMAGE_TAG }} ./${{ matrix.service }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest

      # Cache Docker build layers for subsequent builds
      - name: Docker Buildx Cache
        run: |
          docker buildx build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --push \
            --tag ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.IMAGE_TAG }} \
            ./${{ matrix.service }}

      # Optional: Logout from Azure for security
      - name: Logout from Azure
        run: az logout
        if: always()  # Ensures logout even if the previous step fails
