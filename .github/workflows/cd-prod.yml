name: CD - Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA tag to deploy"
        required: true

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      namespace: w08-prod
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
