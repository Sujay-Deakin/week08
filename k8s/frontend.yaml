# week08/k8s/frontend.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: week10acr.azurecr.io/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ecomm-config-w08e1     # <-- existing ConfigMap name
              key: PRODUCT_SERVICE_URL     # <-- expects this key
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ecomm-config-w08e1
              key: ORDER_SERVICE_URL

        command: ["/bin/sh","-c"]
        args:
          - |
            cat >/usr/share/nginx/html/env.js <<EOF
            window.RUNTIME_ENV = {
              PRODUCT_SERVICE_URL: "${PRODUCT_SERVICE_URL}",
              ORDER_SERVICE_URL: "${ORDER_SERVICE_URL}"
            };
            EOF
            exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-w08e1 # Service name matches
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80 # The port the service listens on inside the cluster
      targetPort: 80 # The port on the Pod (containerPort where Nginx runs)
  type: LoadBalancer # Exposes the service on a port on each Node's IP
